name: ci
on:
  push:
  pull_request:
jobs:
  shellcheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - run: sudo apt-get update -qq && sudo apt-get install -y -qq shellcheck
      - run: shellcheck -s sh occulite-backup tests/run.sh
  test:
    # the script against tests/stub.py (an HTTPS stand-in for GET /api/system/v1/backup) under dash,
    # bash in POSIX mode and busybox's ash
    runs-on: ubuntu-latest
    strategy:
      matrix:
        shell: ["dash", "bash --posix", "busybox sh"]
    steps:
      - uses: actions/checkout@v5
      - run: sudo apt-get update -qq && sudo apt-get install -y -qq busybox dash
      - run: TEST_SH="${{ matrix.shell }}" sh tests/run.sh
  alpine:
    # a NAS-like userland: busybox, curl, no GNU tools
    runs-on: ubuntu-latest
    container: alpine:3.22
    steps:
      - uses: actions/checkout@v5
      - run: apk add --no-cache curl openssl python3
      - run: TEST_SH="busybox sh" sh tests/run.sh
